<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple API Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #7c3aed, transparent 35%),
        radial-gradient(circle at bottom right, #06b6d4, transparent 35%),
        #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(255, 255, 255, 0.15);
    color: rgb(158, 157, 157);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 420px;
      text-align: center;
    }

    button {
      background: #3e6182;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 12px;
    }

    #result {
      margin-top: 16px;
      text-align: left;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Free API Example</h2>
    <button onclick="loadData()">Show a fact</button>
    <div id="result">Click the button to fetch a random fact.</div>
  </div>

  <script>
    async function loadData() {
      const resultBox = document.getElementById('result');
      resultBox.textContent = 'Loading...';

      try {
        const response = await fetch('https://uselessfacts.jsph.pl/random.json?language=en');
        const data = await response.json();

        resultBox.innerHTML = `
          <strong>Fact:</strong> ${data.text}
        `;
      } catch (error) {
        resultBox.textContent = 'Failed to load fact: ' + error.message;
      }
    }
  </script>
</body>
</html>
